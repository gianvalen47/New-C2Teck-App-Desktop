@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111318;--fg:#eceef2;--mut:#9aa1ad;--card:#1a1d24;--bd:#2a2e38;--ac:#6ea0ff;--ic:#eceef2}}
:root[data-theme="dark"]{--bg:#111318;--fg:#eceef2;--mut:#9aa1ad;--card:#1a1d24;--bd:#2a2e38;--ac:#6ea0ff;--ic:#eceef2}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--bd);padding:12px 16px;z-index:2}
h1{font-size:18px;margin:0 0 8px} h1 small{color:var(--mut);font-weight:400;margin-left:6px}
.bar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
input[type=search]{flex:1 1 200px;min-width:0;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font:inherit}
label{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:13px}
input[type=color]{width:30px;height:26px;padding:0;border:1px solid var(--bd);border-radius:6px;background:none}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;padding:16px}
.card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);cursor:pointer;font:inherit;text-align:center;min-width:0;transition:all .15s ease}
.card:hover,.card.ok{border-color:var(--ac);transform:translateY(-1px)}
.card svg{width:var(--sz);height:var(--sz);stroke-width:var(--sw);color:var(--ic);stroke:var(--ic);flex:none}
.k{font-size:12px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c{font-size:11px;color:var(--mut);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.ok .c{color:var(--ac)}
.vacio{padding:40px 16px;color:var(--mut);text-align:center;display:none}
</style></head><body>

<script>
const $=id=>document.getElementById(id), r=document.documentElement.style, cards=[...document.querySelectorAll('.card')];
$('q').oninput=e=>{const t=e.target.value.trim().toLowerCase();let c=0;cards.forEach(x=>{const s=!t||x.dataset.k.includes(t);x.style.display=s?'':'none';if(s)c++});$('n').textContent=c+' iconos';$('v').style.display=c?'none':'block'};
$('sz').oninput=e=>{r.setProperty('--sz',e.target.value+'px');$('szv').textContent=e.target.value};
$('sw').oninput=e=>{r.setProperty('--sw',e.target.value);$('swv').textContent=e.target.value};
$('ic').oninput=e=>{r.setProperty('--ic',e.target.value);};
function copiar(t){try{return navigator.clipboard.writeText(t)}catch(_){}return Promise.reject()}
function fallback(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}
cards.forEach(x=>x.onclick=()=>{const t='<'+x.dataset.c+' />';const f=()=>{x.classList.add('ok');setTimeout(()=>x.classList.remove('ok'),900)};
 Promise.resolve().then(()=>copiar(t)).then(f,()=>{fallback(t);f()})});
</script></body></html>
